# Porta do servidor
server.port=8080

# Configurações do Banco de Dados
# Em produção (Render/Railway), defina DATABASE_URL, DATABASE_USERNAME e DATABASE_PASSWORD.
# Localmente, sem essas variáveis, usa H2 em memória.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:verasdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Mostrar SQL no log para debug
spring.jpa.show-sql=true

# Credenciais do Admin (Basic Auth) - carregadas via variável de ambiente ou .env
spring.security.user.name=${ADMIN_USERNAME:}
spring.security.user.password=${ADMIN_PASSWORD:}
