# Porta do servidor
server.port=8080

# Configurações do Banco de Dados (Supabase - PostgreSQL)
# Substitua as credenciais pelas do seu projeto Supabase
# spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres
# spring.datasource.username=postgres.xxxxxxxxxxxxx
# spring.datasource.password=sua_senha_segura
# spring.jpa.hibernate.ddl-auto=update

# ==== CONFIGURAÇÃO LOCAL PARA TESTE INICIAL (H2) ====
# Para facilitar o desenvolvimento antes de configurar o Supabase,
# usaremos um banco em memória H2 provisoriamente.
spring.datasource.url=jdbc:h2:mem:verasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Mostrar SQL no log para debug
spring.jpa.show-sql=true

# Credenciais do Admin (Basic Auth) para acessar /api/clients via GET
# Troque essa senha em produção!
spring.security.user.name=admin
spring.security.user.password=admin123
